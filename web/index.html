<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Dharumar V — Senior Flutter Developer</title>
  <meta name="description" content="Senior Flutter Developer with 6+ years experience building scalable cross-platform mobile applications using Flutter, Firebase, REST APIs, and clean architecture.">
  <meta name="keywords" content="Flutter Developer, Senior Developer, Mobile App Developer, Cross-platform, Dart, Firebase, Dharumar V">
  <meta name="author" content="Dharumar V">

  <!-- Open Graph -->
  <meta property="og:title" content="Dharumar V — Senior Flutter Developer">
  <meta property="og:description" content="Senior Flutter Developer with 6+ years experience building scalable cross-platform mobile applications.">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dharumar V — Senior Flutter Developer">
  <meta name="twitter:description" content="Senior Flutter Developer with 6+ years experience.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    /* Scope loader styles only to #loading — do NOT use * selector
       as it interferes with Flutter's internal DOM elements */
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A1A;
      overflow: hidden;
    }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: #0A0A1A;
      flex-direction: column;
      gap: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* Spinning gradient ring */
    .logo-ring {
      position: relative;
      width: 72px;
      height: 72px;
    }

    .logo-ring svg {
      position: absolute;
      top: 0; left: 0;
      animation: spin 1.4s linear infinite;
    }

    .logo-initials {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #00D4FF, #7C3AED);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-label {
      font-size: 15px;
      color: #94A3B8;
      letter-spacing: 0.04em;
    }

    /* Progress bar */
    .progress-bar {
      width: 160px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00D4FF, #7C3AED);
      border-radius: 99px;
      animation: progress 8s ease-out forwards;
    }

    @keyframes progress {
      0%   { width: 0%; }
      30%  { width: 40%; }
      60%  { width: 70%; }
      85%  { width: 88%; }
      100% { width: 95%; }
    }

    /* Slow-load hint — appears after 6 s */
    #slow-msg {
      font-size: 12px;
      color: #4A5568;
      text-align: center;
      max-width: 220px;
      line-height: 1.6;
      opacity: 0;
      animation: appear 0.6s ease forwards 6s;
    }

    @keyframes appear {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="logo-ring">
      <svg viewBox="0 0 72 72" width="72" height="72" fill="none">
        <circle cx="36" cy="36" r="33" stroke="rgba(0,212,255,0.15)" stroke-width="3"/>
        <path d="M36 3 a33 33 0 0 1 33 33" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#00D4FF"/>
            <stop offset="100%" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="logo-initials">DV</div>
    </div>

    <div class="loading-label">Loading Portfolio…</div>

    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <div id="slow-msg">
      First load takes a few seconds.<br>
      Subsequent visits will be instant ⚡
    </div>
  </div>

  <script>
    function _hideLoader() {
      var loader = document.getElementById('loading');
      if (!loader) return;
      loader.style.display = 'none';
      document.body.style.overflow = '';
    }

    // Primary: flutter-first-frame event
    window.addEventListener('flutter-first-frame', _hideLoader);

    // Fallback: force-hide after 25 s if event never fires
    var _t = setTimeout(_hideLoader, 25000);
    window.addEventListener('flutter-first-frame', function() { clearTimeout(_t); });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
