<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Dharumar V — Senior Flutter Developer</title>
  <meta name="description" content="Senior Flutter Developer with 6+ years experience building scalable cross-platform mobile applications using Flutter, Firebase, REST APIs, and clean architecture.">
  <meta name="keywords" content="Flutter Developer, Senior Developer, Mobile App Developer, Cross-platform, Dart, Firebase, Dharumar V">
  <meta name="author" content="Dharumar V">

  <!-- Open Graph -->
  <meta property="og:title" content="Dharumar V — Senior Flutter Developer">
  <meta property="og:description" content="Senior Flutter Developer with 6+ years experience building scalable cross-platform mobile applications.">
  <meta property="og:type" content="website">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dharumar V — Senior Flutter Developer">
  <meta name="twitter:description" content="Senior Flutter Developer with 6+ years experience.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0A1A;
      overflow: hidden;
    }
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0A0A1A;
      flex-direction: column;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 212, 255, 0.2);
      border-top-color: #00D4FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      color: #94A3B8;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <span class="loading-text">Loading Portfolio…</span>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
